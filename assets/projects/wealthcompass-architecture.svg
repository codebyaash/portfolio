<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">WealthCompass architecture</title><desc id="d">A local-first Next.js workspace connects financial rule engines to optional Supabase, AI, market data and scheduled sync services.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#171729"/><stop offset="1" stop-color="#283b48"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#b8afff"/></marker><style>.x{fill:#ffffff0b;stroke:#6e688f;stroke-width:1.5}.h{fill:#7568d029;stroke:#b8afff}.t{fill:#f7f3ed;font:600 18px Arial}.s{fill:#aaa8bd;font:13px Arial}.k{fill:#8fe3cd;font:12px monospace}.l{stroke:#b8afff;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="620" rx="20" fill="url(#b)"/><text class="k" x="55" y="55">WEALTHCOMPASS / LOCAL-FIRST PRODUCT ARCHITECTURE</text><rect class="h" x="440" y="90" width="320" height="105" rx="10"/><text class="t" x="478" y="130">Next.js Workspace</text><text class="s" x="478" y="159">Dashboard · Portfolio · Goals · Mentor</text><path class="l" d="M600 195v70"/><rect class="x" x="390" y="265" width="420" height="115" rx="10"/><text class="t" x="425" y="305">Domain Rule Engines</text><text class="s" x="425" y="334">Risk · Health · Goals · Import · Dashboard</text><text class="s" x="425" y="356">Deterministic, testable, provider-independent</text><path class="l" d="M390 322H245"/><rect class="x" x="55" y="267" width="190" height="110" rx="10"/><text class="t" x="88" y="307">Local State</text><text class="s" x="88" y="336">Offline demo · autosave</text><path class="l" d="M810 322h145"/><rect class="x" x="955" y="267" width="190" height="110" rx="10"/><text class="t" x="985" y="307">Supabase</text><text class="s" x="985" y="336">Auth · RLS · Cloud sync</text><path class="l" d="M500 380v95"/><path class="l" d="M700 380v95"/><rect class="x" x="29