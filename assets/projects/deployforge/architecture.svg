<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">DeployForge system architecture</title><desc id="d">A Next.js dashboard communicates with a FastAPI control plane, which orchestrates parsing, planning, policy, simulation, and persistence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171729"/><stop offset="1" stop-color="#30295a"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#b8afff"/></marker><style>.box{fill:#ffffff0c;stroke:#7770a8;stroke-width:1.5}.hi{fill:#ff7a681c;stroke:#ff8a78}.tx{fill:#f7f3ed;font:600 18px Arial}.sm{fill:#aaa8bd;font:13px Arial}.tag{fill:#b8afff;font:12px monospace}.line{stroke:#b8afff;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="620" rx="20" fill="url(#bg)"/><text x="55" y="55" class="tag">DEPLOYFORGE / CONTROL-PLANE ARCHITECTURE</text><rect class="box" x="55" y="105" width="220" height="110" rx="10"/><text class="tx" x="85" y="145">Next.js Dashboard</text><text class="sm" x="85" y="175">Upload · Plan · Graph</text><text class="sm" x="85" y="195">Cost · History · Rollback</text><path class="line" d="M275 160h100"/><rect class="hi" x="375" y="95" width="255" height="130" rx="10"/><text class="tx" x="405" y="138">FastAPI Control Plane</text><text class="sm" x="405" y="169">JWT · Pydantic · OpenAPI</text><text class="sm" x="405" y="194">User-owned workspaces</text><path class="line" d="M630 160h100"/><rect class="box" x="730" y="105" width="210" height="110" rx="10"/><text class="tx" x="760" y="145">SQLAlchemy</text><text class="sm" x="760" y="175">Projects · Templates</text><text class="sm" x="760" y="195">Snapshots · Events</text><path class="line" d="M940 160h70"/><rect class="box" x="1010" y="115" width="140" height="90" rx="10"/><text class="tx" x="1038" y="151">Database</text><text class="sm" x="1038" y="178">SQLite / PG</text><text class="tag" x="55" y="295">SIMULATION PIPELINE</text><rect class="box" x="55" y="330" width="165" height="90" rx="9"/><text class="tx" x="84" y="367">IaC Parser</text><text class="sm" x="84" y="392">HCL · YAML · JSON · Bicep</text><path class="line" d="M220 375h55"/><rect class="box" x="275" y="330" width="165" height="90" rx="9"/><text class="tx" x="308" y="367">State Diff</text><text class="sm" x="308" y="392">Create · Update · Delete</text><path class="line" d="M440 375h55"/><rect class="box" x="495" y="330" width="165" height="90" rx="9"/><text class="tx" x="526" y="367">Policy</text><text class="sm" x="526" y="392">Risk · Cost · Tags</text><path class="line" d="M660 375h55"/><rect class="hi" x="715" y="330" width="190" height="90" rx="9"/><text class="tx" x="743" y="367">Pipeline Simulator</text><text class="sm" x="743" y="392">Deterministic stages + logs</text><path class="line" d="M905 375h55"/><rect class="box" x="960" y="330" width="190" height="90" rx="9"/><text class="tx" x="995" y="367">State Snapshot</text><text class="sm" x="995" y="392">Persist · Restore · Audit</text><path class="line" d="M503 225v55H138v50"/><path class="line" d="M810 420v72H503V225"/><rect class="box" x="55" y="500" width="1095" height="70" rx="9"/><text class="tag" x="82" y="530">DELIVERY</text><text class="sm" x="82" y="552">GitHub Actions → dependency check → migration smoke test → pytest → Next.js build → TypeScript validation</text></svg>
