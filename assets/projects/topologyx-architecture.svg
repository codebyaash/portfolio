<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description"><title id="title">TopologyX system architecture</title><desc id="description">Requirements enter a Next.js workspace and FastAPI services, then follow deterministic or optional AI generation paths to create architecture, review, cost and infrastructure as code outputs that can be saved in project history.</desc><defs><linearGradient id="background" x2="1"><stop stop-color="#171729"/><stop offset="1" stop-color="#392849"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#ff9a8c"/></marker><style>.box{fill:#ffffff0b;stroke:#6e688f;stroke-width:1.5}.focus{fill:#ff7a681b;stroke:#ff8a78;stroke-width:1.5}.title{fill:#f7f3ed;font:600 18px Arial}.sub{fill:#aaa8bd;font:13px Arial}.label{fill:#ff9a8c;font:12px monospace}.line{stroke:#ff9a8c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="650" rx="20" fill="url(#background)"/><text class="label" x="55" y="52">TOPOLOGYX / REQUIREMENTS-TO-ARCHITECTURE FLOW</text><rect class="box" x="55" y="95" width="220" height="105" rx="10"/><text class="title" x="85" y="137">Workload Brief</text><text class="sub" x="85" y="168">Goals · scale · constraints</text><path class="line" d="M275 147h60"/><rect class="focus" x="335" y="85" width="235" height="125" rx="10"/><text class="title" x="366" y="130">Next.js Workspace</text><text class="sub" x="366" y="160">Projects · diagrams · IaC</text><text class="sub" x="366" y="184">React Flow · Monaco</text><path class="line" d="M570 147h65"/><rect class="focus" x="635" y="85" width="245" height="125" rx="10"/><text class="title" x="668" y="130">FastAPI Services</text><text class="sub" x="668" y="160">Architecture · security · cost</text><text class="sub" x="668" y="184">IaC · auth · history</text><path class="line" d="M880 147h65"/><rect class="box" x="945" y="95" width="200" height="105" rx="10"/><text class="title" x="974" y="137">Project History</text><text class="sub" x="974" y="168">Users · runs · context</text><path class="line" d="M755 210v78H395v52"/><path class="line" d="M755 210v78h240v52"/><rect class="box" x="245" y="340" width="300" height="105" rx="10"/><text class="label" x="278" y="375">BASELINE PATH</text><text class="title" x="278" y="405">Deterministic Engine</text><text class="sub" x="278" y="429">Reliable preview · no provider key</text><rect class="box" x="845" y="340" width="300" height="105" rx="10"/><text class="label" x="878" y="375">OPTIONAL ENHANCEMENT</text><text class="title" x="878" y="405">OpenAI / Azure OpenAI</text><text class="sub" x="878" y="429">Context-aware recommendations</text><path class="line" d="M395 445v72h170"/><path class="line" d="M995 445v72H835"/><rect class="focus" x="565" y="480" width="270" height="115" rx="10"/><text class="title" x="597" y="518">Architecture Package</text><text class="sub" x="597" y="548">Topology · pillar review · cost</text><text class="sub" x="597" y="572">Scaling · Bicep · Terraform</text><rect class="box" x="55" y="500" width="390" height="95" rx="10"/><text class="label" x="86" y="535">REVIEW BOUNDARY</text><text class="sub" x="86" y="565">Engineer validates assumptions before deployment</text></svg>
